; SereniSuit — ESP32-S3 firmware
; Board: Espressif ESP32-S3-DevKitC-1 (N8R8)
; Sensor: AD8232 single-lead ECG (analog, no library needed)
;   OUTPUT -> GPIO5   LO+ -> GPIO6   LO- -> GPIO7   3.3V -> 3V3   GND -> G
; Screen: SSD1306 0.96" OLED, I2C 0x3C -> SDA GPIO8, SCL GPIO9
;   (set ENABLE_OLED 0 at the top of src/main.cpp to run without it)
;   Motor: DRV8833 IN1 <- GPIO4
;
;   pio run                 build
;   pio run -t upload       flash the board
;   pio device monitor      serial at 115200
;
; Wi-Fi dashboard (laptop website + phone app, paired): by default the suit
; makes its own network SereniSuit-Demo / seresuit123 -> open
; http://192.168.4.1 on both devices. Runs from a power bank; the laptop is
; only needed to flash. See the Wi-Fi settings at the top of src/main.cpp.
;
; Bluetooth LE runs at the same time (advertises as "SereniSuit"); the
; Bluetooth dashboard is demo1/bluetooth-app/index.html. Wi-Fi + Bluetooth
; together need more room than the 1.25 MB default app slot, so this uses
; the 8 MB layout (3.2 MB per app slot) that matches the N8R8's flash.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; N8R8 = 8 MB flash, 8 MB PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -O2

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    esphome/AsyncTCP-esphome @ ^2.1.4
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
    bblanchon/ArduinoJson @ ^7.2.0
    h2zero/NimBLE-Arduino @ ~1.4.3
